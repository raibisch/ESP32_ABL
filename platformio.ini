; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_s2_mini
#default_envs  = waveshare_esp32_s3_rs485_can
#default_envs = esp32-poe

[common]
monitor_speed = 115200
lib_deps_external = 
	#ESP32Async/ESPAsyncWebServer
	https://github.com/ESP32Async/ESPAsyncWebServer@3.11.2
	##ESP32Async/ESPAsyncWebServer @ 3.11.2
	https://github.com/fbiego/ESP32Time.git
	256dpi/MQTT
	https://github.com/dvarrel/ESPping
	
[env:m5Atom]
platform = espressif32
framework = arduino
board = m5stack-core-esp32
monitor_speed = ${common.monitor_speed}
upload_port = /dev/ttyUSB0
lib_deps = 
	${common.lib_deps_external}

[env:lolin_s2_mini]
#platform = espressif32
platform = https://github.com/platformio/platform-espressif32.git 
framework = arduino
board = lolin_s2_mini
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
build_unflags = -DARDUINO_USB_MODE
build_flags = 
  
    -DWB_COUNT=2
    -DABL_RXD_GPIO=39
	-DABL_TXT_GPIO=37
	-DABL_RX_LOW_ENABLE_GPIO=35
	-DLED_GPIO=15
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEF_S2_MINI=1
	-DWEB_APP=1
	#-DDEBUG_WITHOUT_ABL=1
	#-DMQTT_ENABLE=1
	#-DDEBUG_PRINT=1
lib_deps = 
	${common.lib_deps_external}
extra_scripts = post_build.py

[env:esp32-poe]
platform = espressif32
framework = arduino
board = esp32-poe
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_protocol = esptool
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
build_flags = 
    -DWB_COUNT=1
    -DABL_RXD_GPIO=35
	-DABL_TXT_GPIO=33
	-DABL_RX_LOW_ENABLE_GPIO=32
	-DUSE_ETH_INSTEAD_WIFI=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DWITHOUT_TEMP=1
	-DWITHOUT_LED=1
	-DDEBUG_PRINT=1
	-DWEB_APP=1
	#-DDEBUG_WITHOUT_ABL=1
lib_deps = 
	${common.lib_deps_external}
	
[env:waveshare_esp32_s3_rs485_can]
#platform = espressif32
platform = https://github.com/platformio/platform-espressif32.git 
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DWEB_APP=1
    -DWB_COUNT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
	-DABL_RXD_GPIO=18
	-DABL_TXT_GPIO=17
	-DABL_RX_LOW_ENABLE_GPIO=21
	-DWITHOUT_LED=1
	-DDEBUG_PRINT=1
	#-DPINGTEST=1
	
	#-DDEBUG_WITHOUT_ABL=1
	#-DMQTT_ENABLE=1
lib_deps = 
	${common.lib_deps_external}
extra_scripts = post_build.py

	



