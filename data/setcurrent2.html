<!DOCTYPE HTML>
<html>

    <head>
        <title>%DEVICEID2%</title>
        <meta content="width=device-width, initial-scale=0.90, user-scalable=yes" name="viewport">
        <link rel="stylesheet" type="text/css" href="style.css">
        <meta charset="UTF-8">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#ffffff">
    </head>

    <body >
    <div class="outer_frame">
         <h2>%DEVICEID02% Set I-MAX</h2>
         </p>
         <p><form action="" method="POST" >
          <input class="buttonred" name="ihigh2" type="submit" value="%I-HIGH%">
         </form></p>
         <p><form action="" method="POST" >
          <input class="buttongreen" name="ilow2" type="submit" value="%I-LOW%">
         </form></p>
      
         <div style="height: 50px; margin-left: 90px; margin-right: 96px;">
            <input class="slider" type="range" id="pwmSlider" min="6" max="16" step="2" value="%IMAX2%"  list="values" />
            <datalist id="values" style="--list-length: 6;">   
                  <option>6</option>
                  <option>8</option>
                  <option>10</option>
                  <option>12</option>
                  <option>14</option>
                  <option>16</option>
            </datalist>
         </div></p>

         <span id="textSliderValue">%IMAX2% [A]</span></p>
         <div style="height: 100px;"> </div>
</div>
<div class="outer_frame">
         <button type="button" class="image-btn" onclick="window.location.href='index2.html'"><img src="wb.png">%DEVICEID02%</button>
         <button type="button" class="image-btn" > </button>
         <button type="button" class="image-btn" onclick="window.location.href='setup.html'"><img src="settings.png">Setup</button>
</div>
         <script type="text/javascript">

            const input = document.getElementById('pwmSlider');
            output = document.getElementById('textSliderValue');
          
            const delay = millis => new Promise((resolve, reject) => 
            {
              setTimeout(_ => resolve(), millis)
            });

            const gotohome = async function() 
            {
             await delay(2000);
             window.location.href = 'index2.html';
            }

            input.onchange = function()
            {
                var sliderValue = document.getElementById("pwmSlider").value;
                document.getElementById("textSliderValue").innerHTML = sliderValue + " [A]";
                console.log(sliderValue);
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "/fetch2?imax="+sliderValue, true);
                xhr.send();
                gotohome();
            };
         </script>
    </body>

</html>
